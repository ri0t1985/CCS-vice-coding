<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Fruit Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header role="banner">
      <div class="header-center">
        <a href="index.html" class="logo" aria-label="Go to homepage">
          <img
            src="img/giraffe-logo.svg"
            class="logo-img"
            alt="Fruit Shop Logo"
          />
          <span class="products-text" style="text-align: center">
            View Products
          </span>
        </a>
      </div>
    </header>
    <main id="main-content" role="main">
      <div class="content-box" style="text-align: center">
        <div style="font-size: 4rem" role="img" aria-label="Confused giraffe">
          🦒
        </div>
        <h1>Oops! This product is grazing elsewhere.</h1>
        <p>
          The page you're trying to reach is currently unavailable. Please
          return to the shop and explore the fruits that are still in season.
        </p>
        <div style="margin-top: 1.2rem">
          <a href="index.html">
            <button class="cart-action-btn" aria-label="Return to homepage">
              Back to Products
            </button>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
